# Strict mode: once anything untrusted is in context, side effects need a human.
version: 1
default: allow
rules:
  - id: untrusted-cannot-steer-egress
    when: {tool_class: [egress]}
    if: [control_args_untrusted]
    action: block
    reason: Destination or action was chosen by untrusted content
  - id: untrusted-cannot-steer-writes
    when: {tool_class: [write]}
    if: [control_args_untrusted]
    action: block
    reason: Write target was chosen by untrusted content
  - id: sensitive-stays-inside
    when: {tool_class: [egress]}
    if:
      - sensitive_data_to_unapproved_destination: {level: sensitive}
    action: block
    reason: Sensitive data headed to a destination the user did not name
  - id: secrets-stay-inside
    # Reads count: a credential in a fetched URL has already left.
    when: {tool_class: [read, write, egress]}
    if:
      - args_contain_secrets: {kinds: [secrets], scope: any}
    action: redact
    redact: {kinds: [secrets], scope: any}
    reason: Outgoing data contains a credential the user did not provide; it was masked

  - id: untrusted-links-in-outbound-data
    when: {tool_class: [egress, write]}
    if: [data_args_carry_untrusted_destinations]
    action: ask
    reason: Outgoing content contains a link or address that only untrusted content supplied
  - id: ask-after-taint
    when: {tool_class: [write, egress]}
    if: [session_tainted]
    action: ask
    reason: Untrusted content is in context; confirm this side effect
