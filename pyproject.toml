[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentwall"
version = "0.1.0"
description = "Provenance-aware security gateway for MCP agents: stops untrusted content from steering trusted tools."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aviral Madhvan" }]
keywords = ["mcp", "llm", "agents", "security", "prompt-injection", "information-flow-control"]
dependencies = [
  "mcp>=2.3,<3",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "pynacl>=1.5",
  "anyio>=4.4",
]

[project.optional-dependencies]
ml = ["transformers>=4.44", "torch>=2.3"]
agent = ["google-genai>=1.0"]
agentdojo = ["agentdojo==0.1.35", "google-genai>=1.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
agentwall = "agentwall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: end-to-end tests that spawn subprocesses",
  "live: calls a real model API (skipped without a key)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# query() must match AgentDojo's BasePipelineElement signature, defaults included.
"src/agentwall/integrations/agentdojo/pipeline.py" = ["B006", "B008"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
